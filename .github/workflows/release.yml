name: Build and Release Nexus-Chat

on:
  workflow_dispatch: # 允许手动点击运行
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ================= Windows 构建 =================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Briefcase
        run: pip install briefcase
      - name: Build Windows Installer
        run: briefcase create && briefcase build && briefcase package
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-chat-windows
          path: dist/*.msi

  # ================= macOS 构建 (已修复签名问题) =================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Briefcase
        run: pip install briefcase
      
      # 【关键修复】告诉 Briefcase 不要尝试签名，否则 CI 会报错 214
      - name: Disable macOS Signing
        run: |
          echo "BRIEFCASE_NO_SIGN=1" >> $GITHUB_ENV
          
      - name: Build macOS App
        run: briefcase create && briefcase build && briefcase package --adhoc-sign
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-chat-macos
          path: dist/*.dmg

  # ================= Android 构建 (新增) =================
    # ================= Android 构建 =================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 推荐用稳定的 3.12

      - name: Install Briefcase
        run: pip install briefcase

      - name: Build Android App
        run: |
          # 创建并打包 Android Debug 版本
          briefcase create android
          briefcase build android
          briefcase package android --format apk

      # 👇👇👇 关键修改：调试与上传 👇👇👇
      - name: Find APK file
        run: |
          echo "正在查找生成的 APK 文件..."
          # 使用 find 命令在整个构建目录下寻找 .apk 文件
          find build -name "*.apk" 
          # 将找到的第一个 apk 复制到根目录，方便上传
          cp $(find build -name "*.apk" | head -n 1) Nexus-Chat-Android.apk || echo "未找到APK"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Chat-Android
          # 直接上传刚才复制出来的文件，或者用更宽泛的路径
          path: Nexus-Chat-Android.apk 
          if-no-files-found: error # 如果没找到文件就报错，不要静默失败
