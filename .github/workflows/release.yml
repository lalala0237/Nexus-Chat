name: Build and Release Nexus-Chat

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ================= Windows 构建 =================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Briefcase
        run: pip install briefcase
      - name: Build Windows Installer
        run: briefcase create && briefcase build && briefcase package
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-chat-windows
          path: dist/*.msi

  # ================= macOS 构建 (已修复签名问题) =================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Briefcase
        run: pip install briefcase
      - name: Disable macOS Signing
        run: |
          echo "BRIEFCASE_NO_SIGN=1" >> $GITHUB_ENV
      - name: Build macOS App
        run: briefcase create && briefcase build && briefcase package --adhoc-sign
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-chat-macos
          path: dist/*.dmg

  # ================= Android 构建 =================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Briefcase
        run: pip install briefcase
      - name: Build Android App
        run: |
          briefcase create android
          briefcase build android
          briefcase package android --p apk
      - name: Find APK file
        run: |
          echo "正在查找生成的 APK 文件..."
          find build -name "*.apk"
          cp $(find build -name "*.apk" | head -n 1) Nexus-Chat-Android.apk || echo "未找到APK"
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Chat-Android
          path: Nexus-Chat-Android.apk
          if-no-files-found: error

  # ================= 创建 Release =================
  # 依赖所有构建 Job，负责下载文件、计算 SHA256 并创建 Release
  create-release:
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Get version info
        id: get_version
        run: |
          TAG="${{ github.ref }}"
          TAG=${TAG##*/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Generate Checksums
        id: generate_checksums
        run: |
          cd dist
          # 创建校验和文件
          > checksums.txt
          
          # 查找并计算所有安装包的哈希值
          find . -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) -exec sha256sum {} \; >> checksums.txt
          
          # 将校验和文件内容设置为步骤输出，供后续 Job 使用
          echo "checksum_body<<EOF" >> $GITHUB_OUTPUT
          cat checksums.txt
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        # 使用更现代、更可靠的 action-gh-release
        uses: softprops/action-gh-release@v2 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.get_version.outputs.tag }}
          name: Nexus-Chat ${{ steps.get_version.outputs.version }}
          body: |
            🚀 自动发布 v${{ steps.get_version.outputs.version }}

            **文件校验值 (SHA256):**
            \`\`\`
            ${{ steps.generate_checksums.outputs.checksum_body }}
            \`\`\`
          # 自动上传 dist/ 目录下的所有文件
          files: dist/**

    # ================= 生成版本文件并推送到 NC-Updater =================
  generate-version-files:
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 获取基础信息
      - name: Get version info
        id: get_info
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # 2. 下载刚刚生成的 checksums.txt 以获取 Hash 值
      - name: Download Checksums
        run: |
          # 从 Release 页面下载最新的 checksums.txt
          curl -L -o checksums.txt \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.get_info.outputs.tag }}/checksums.txt"
          
          # 解析 Hash 值到环境变量 (适配 Nexus-Chat-Platform-Version.ext 格式)
          WIN_HASH=$(grep 'Windows' checksums.txt | awk '{print $1}')
          MAC_HASH=$(grep 'MacOS' checksums.txt | awk '{print $1}')
          AND_HASH=$(grep 'Android' checksums.txt | awk '{print $1}')

          echo "windows_hash=$WIN_HASH" >> $GITHUB_ENV
          echo "macos_hash=$MAC_HASH" >> $GITHUB_ENV
          echo "android_hash=$AND_HASH" >> $GITHUB_ENV
          
          echo "✅ Hashes loaded:"
          echo "Win: $WIN_HASH"
          echo "Mac: $MAC_HASH"
          echo "And: $AND_HASH"

      # 3. 生成 version.json (当前最新版本)
      - name: Generate version.json
        run: |
          VERSION="${{ steps.get_info.outputs.version }}"
          TAG="${{ steps.get_info.outputs.tag }}"
          REPO="${{ github.repository }}"
          NOW=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S CST')

          cat > version.json << EOF
          {
            "latest_version": "$VERSION",
            "release_date": "$NOW",
            "release_notes": "Release $VERSION",
            "downloads": {
              "windows": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-Windows-$VERSION.msi",
              "macos": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-MacOS-$VERSION.dmg",
              "android": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-Android-$VERSION.apk"
            },
            "checksums": {
              "windows": "$windows_hash",
              "macos": "$macos_hash",
              "android": "$android_hash"
            }
          }
          EOF

      # 4. 拉取旧的历史版本文件
      - name: Fetch existing version_history.json
        run: |
          curl -sf "https://lalala0237.github.io/NC-Updater/version_history.json" \
            -o old_history.json 2>/dev/null || echo "" > old_history.json

      # 5. 生成带注释的 version_history.json (重构拼接逻辑)
      - name: Generate version_history.json
        run: |
          VERSION="${{ steps.get_info.outputs.version }}"
          TAG="${{ steps.get_info.outputs.tag }}"
          REPO="${{ github.repository }}"
          NOW=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S CST')
          
          # 判断是否为预发布
          IS_PRE="false"
          VER_TYPE="正式版本 (Stable)"
          VER_WARN="// ✅ 此版本为正式发布版本，推荐所有用户更新"
          if [[ "$VERSION" == *"-"* ]]; then
            IS_PRE="true"
            VER_TYPE="预发布版本 (Prerelease)"
            VER_WARN="// ⚠️ 注意：此版本为预发布版本，可能包含未修复的 Bug，仅供测试使用"
          fi

          # --- A. 写入文件头注释 ---
          cat > version_history.json << 'HEADER'
          // ====================================================================
          //  Nexus Chat - 版本发布历史记录文件 (Version Release History)
          // ... (此处省略你的长注释，保持原样即可) ...
          // ====================================================================

          HEADER

          # --- B. 写入当前版本的注释块 ---
          cat >> version_history.json << EOF
          // --------------------------------------------------------------------
          //  版本: $TAG ($VER_TYPE)
          //  发布时间: $NOW
          //  Git Tag: $TAG
          //  构建仓库: $REPO
          $VER_WARN
          // --------------------------------------------------------------------
          EOF

          # --- C. 写入当前版本的 JSON 数据 (注意结尾有逗号，因为后面还要接旧的) ---
          cat >> version_history.json << EOF
          {
            "history": [
              {
                "version": "$VERSION",
                "release_date": "$NOW",
                "is_prerelease": $IS_PRE,
                "tag_name": "$TAG",
                "release_page": "https://github.com/$REPO/releases/tag/$TAG",
                "downloads": {
                  "windows": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-Windows-$VERSION.msi",
                  "macos": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-MacOS-$VERSION.dmg",
                  "android": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-Android-$VERSION.apk"
                },
                "checksums": {
                  "windows": "$windows_hash",
                  "macos": "$macos_hash",
                  "android": "$android_hash"
                }
              },
          EOF

          # --- D. 安全地合并旧数据 ---
          if [ -s old_history.json ]; then
            # 1. 去除旧文件中的所有注释行 (// 开头)
            # 2. 去除第一行 ({) 和最后一行 (})
            # 3. 去除首尾空白
            grep -v '^\s*//' old_history.json | sed '1d;$d' | sed '/./,$!d' >> version_history.json
          fi

          # --- E. 闭合 JSON ---
          echo "  ]" >> version_history.json
          echo "}" >> version_history.json

          echo "✅ version_history.json generated successfully."

      # 6. 推送到 NC-Updater 仓库
      - name: Push to NC-Updater
        env:
          MY_TOKEN: ${{ secrets.UPDATER_REPO_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${MY_TOKEN}@github.com/lalala0237/NC-Updater.git target_repo

          cp "$GITHUB_WORKSPACE/version.json" target_repo/
          cp "$GITHUB_WORKSPACE/version_history.json" target_repo/

          cd target_repo
          if [ -z "$(git status --porcelain)" ]; then
            echo "✅ No changes detected, skipping push."
            exit 0
          fi

          git add .
          git commit -m "chore: auto update version files from Nexus-Chat"
          git push origin main
          echo "✅ Successfully pushed to lalala0237/NC-Updater"
