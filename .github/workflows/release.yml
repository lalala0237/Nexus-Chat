name: Build and Release Nexus-Chat

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ================= Windows 构建 =================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Briefcase
        run: pip install briefcase
      - name: Build Windows Installer
        run: briefcase create && briefcase build && briefcase package
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-chat-windows
          path: dist/*.msi

  # ================= macOS 构建 (已修复签名问题) =================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Briefcase
        run: pip install briefcase
      - name: Disable macOS Signing
        run: |
          echo "BRIEFCASE_NO_SIGN=1" >> $GITHUB_ENV
      - name: Build macOS App
        run: briefcase create && briefcase build && briefcase package --adhoc-sign
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-chat-macos
          path: dist/*.dmg

  # ================= Android 构建 =================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Briefcase
        run: pip install briefcase
      - name: Build Android App
        run: |
          briefcase create android
          briefcase build android
          briefcase package android --p apk
      - name: Find APK file
        run: |
          echo "正在查找生成的 APK 文件..."
          find build -name "*.apk"
          cp $(find build -name "*.apk" | head -n 1) Nexus-Chat-Android.apk || echo "未找到APK"
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Chat-Android
          path: Nexus-Chat-Android.apk
          if-no-files-found: error

  # ================= 创建 Release 并计算 Hash =================
  # 依赖所有构建 Job，负责计算 SHA256 并创建 Release
  create-release:
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      windows_hash: ${{ steps.checksum.outputs.windows_hash }}
      macos_hash: ${{ steps.checksum.outputs.macos_hash }}
      android_hash: ${{ steps.checksum.outputs.android_hash }}
    steps:
      - name: Get version info
        id: get_version
        run: |
          TAG="${{ github.ref }}"
          TAG=${TAG##*/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Generate Checksums
        run: |
          cd dist
          # 创建一个空的校验和文件
          > checksums.txt
          
          # 自动查找并计算所有安装包的哈希值
          # 这里列出了常见的安装包后缀，你可以根据实际生成的文件调整
          find . -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) -exec sha256sum {} \; >> checksums.txt
          
          # 打印出来看看
          cat checksums.txt

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          release_name: Nexus-Chat ${{ steps.get_version.outputs.version }}
          body: |
            🚀 自动发布 v${{ steps.get_version.outputs.version }}

            **文件校验值 (SHA256):**
            - Windows: \`${{ steps.checksum.outputs.windows_hash }}\`
            - macOS: \`${{ steps.checksum.outputs.macos_hash }}\`
            - Android: \`${{ steps.checksum.outputs.android_hash }}\`
          draft: false
          # 上传 Release Assets
          assets_path: dist/

  # ================= 生成版本文件并推送到 NC-Updater =================
  # 依赖 create-release，以便获取 SHA256 值
  generate-version-files:
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 获取版本信息和 Hash 值
      - name: Get version and hash info
        id: get_info
        run: |
          TAG="${{ github.ref }}"
          TAG=${TAG##*/}
          VERSION=${TAG#v}
          # 从依赖的 Job 中获取输出
          WINDOWS_HASH="${{ needs.create-release.outputs.windows_hash }}"
          MACOS_HASH="${{ needs.create-release.outputs.macos_hash }}"
          ANDROID_HASH="${{ needs.create-release.outputs.android_hash }}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "windows_hash=$WINDOWS_HASH" >> $GITHUB_OUTPUT
          echo "macos_hash=$MACOS_HASH" >> $GITHUB_OUTPUT
          echo "android_hash=$ANDROID_HASH" >> $GITHUB_OUTPUT

      # ---------- 生成 version.json ----------
      - name: Generate version.json
        run: |
          VERSION="${{ steps.get_info.outputs.version }}"
          TAG="${{ steps.get_info.outputs.tag }}"
          REPO="${{ github.repository }}"
          NOW=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S CST')
          WINDOWS_HASH="${{ steps.get_info.outputs.windows_hash }}"
          MACOS_HASH="${{ steps.get_info.outputs.macos_hash }}"
          ANDROID_HASH="${{ steps.get_info.outputs.android_hash }}"

          cat > version.json << EOF
          {
            "latest_version": "$VERSION",
            "release_date": "$NOW",
            "release_notes": "Release $VERSION",
            "downloads": {
              "windows": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-$VERSION.msi",
              "macos": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-$VERSION.dmg",
              "android": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-Android.apk"
            },
            "checksums": {
              "windows": "$WINDOWS_HASH",
              "macos": "$MACOS_HASH",
              "android": "$ANDROID_HASH"
            }
          }
          EOF

      # ---------- 拉取旧的历史版本文件 ----------
      - name: Fetch existing version_history.json
        run: |
          curl -sf "https://lalala0237.github.io/NC-Updater/version_history.json" \
            -o old_history.json 2>/dev/null || echo "" > old_history.json

      # ---------- 生成带注释的 version_history.json ----------
      - name: Generate version_history.json
        run: |
          VERSION="${{ steps.get_info.outputs.version }}"
          TAG="${{ steps.get_info.outputs.tag }}"
          REPO="${{ github.repository }}"
          NOW=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S CST')
          IS_PRE="false"
          if [[ "$VERSION" == *-* ]]; then
            IS_PRE="true"
          fi

          if [ "$IS_PRE" = "true" ]; then
            VER_TYPE="预发布版本 (Prerelease)"
            VER_WARN="// ⚠️  注意：此版本为预发布版本，可能包含未修复的 Bug，仅供测试使用"
          else
            VER_TYPE="正式版本 (Stable)"
            VER_WARN="// ✅ 此版本为正式发布版本，推荐所有用户更新"
          fi

          # --- 写入文件头注释 ---
          cat > version_history.json << 'HEADER'
          // ====================================================================
          //  Nexus Chat - 版本发布历史记录文件 (Version Release History)
          // ====================================================================
          //
          //  【文件用途】
          //    本文件完整记录了 Nexus Chat 项目自首次发布以来的所有版本发布信息，
          //    包括正式版本（Stable）和预发布版本（Prerelease / Beta / RC）。
          //    供客户端「历史版本」页面展示，以及版本回溯、问题排查使用。
          //
          //  【文件维护方式】
          //    本文件由 GitHub Actions 自动化工作流 (release.yml) 在每次成功构建
          //    并创建 Release 后自动更新。请勿手动编辑本文件，手动修改将在下次
          //    自动发布时被覆盖。
          //
          //  【文件格式说明】
          //    - 文件顶部的 "//" 开头行为注释，不会被 JSON 解析器读取
          //    - JSON 数据部分（"history" 数组）为纯 JSON，可被标准解析器正常读取
          //    - 客户端 updater.py 使用正则去除 "//" 注释行后再进行 JSON 解析
          //
          //  【字段说明】
          //    - version        : 版本号（SemVer 2.0.0，格式 x.y.z 或 x.y.z-pre）
          //    - release_date   : 发布时间（北京时间 UTC+8）
          //    - is_prerelease  : 是否为预发布版本（true / false）
          //    - tag_name       : 对应的 Git Tag 名称
          //    - release_page   : GitHub Release 页面链接
          //    - downloads      : 各平台下载链接
          //    - checksums      : 各平台文件的 SHA256 校验值
          //
          // ====================================================================

          HEADER

          # --- 写入当前版本的注释块 ---
          cat >> version_history.json << EOF
          // --------------------------------------------------------------------
          //  版本: $TAG ($VER_TYPE)
          //  发布时间: $NOW
          //  Git Tag: $TAG
          //  构建仓库: $REPO
          $VER_WARN
          // --------------------------------------------------------------------
          EOF

          # --- 写入 JSON 数据：当前版本条目 ---
          cat >> version_history.json << EOF
          {
            "history": [
              {
                "version": "$VERSION",
                "release_date": "$NOW",
                "is_prerelease": $IS_PRE,
                "tag_name": "$TAG",
                "release_page": "https://github.com/$REPO/releases/tag/$TAG",
                "downloads": {
                  "windows": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-$VERSION.msi",
                  "macos": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-$VERSION.dmg",
                  "android": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-Android.apk"
                },
                "checksums": {
                  "windows": "${{ steps.get_info.outputs.windows_hash }}",
                  "macos": "${{ steps.get_info.outputs.macos_hash }}",
                  "android": "${{ steps.get_info.outputs.android_hash }}"
                }
              }
          EOF

          # --- 合并旧的历史版本条目 ---
          if [ -s old_history.json ]; then
            grep -v '^\s*//' old_history.json | tail -n +3 | sed '$ d' >> version_history.json 2>/dev/null
            if [ -s old_history.json ]; then
              echo "    }," >> version_history.json
            fi
          else
            echo "    }" >> version_history.json
          fi

          echo "  ]" >> version_history.json
          echo "}" >> version_history.json

      # ---------- 推送到 NC-Updater 仓库 ----------
      - name: Push to NC-Updater
        env:
          MY_TOKEN: ${{ secrets.UPDATER_REPO_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${MY_TOKEN}@github.com/lalala0237/NC-Updater.git target_repo

          cp "$GITHUB_WORKSPACE/version.json" target_repo/
          cp "$GITHUB_WORKSPACE/version_history.json" target_repo/

          cd target_repo
          
          if [ -z "$(git status --porcelain)" ]; then
            echo "✅ No changes detected, skipping push."
            exit 0
          fi

          git add .
          git commit -m "chore: auto update version files from Nexus-Chat"
          git push origin main
          echo "✅ Successfully pushed to lalala0237/NC-Updater"
