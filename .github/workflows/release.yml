name: Build and Release Nexus-Chat

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ================= Windows 构建 =================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Briefcase
        run: pip install briefcase
      - name: Build Windows Installer
        run: briefcase create && briefcase build && briefcase package
      - name: Rename & Upload Artifact
        shell: pwsh
        run: |
          $VER = "${{ github.ref_name }}" -replace '^v', ''
          $NEW_NAME = "Nexus-Chat-Windows-v${VER}.msi"
          
          # 查找生成的 msi 文件并重命名
          $FILE = Get-ChildItem -Path dist -Filter *.msi | Select-Object -First 1
          if ($FILE) {
              Rename-Item -Path $FILE.FullName -NewName $NEW_NAME
              Write-Host "Renamed to: $NEW_NAME"
          } else {
              Write-Error "MSI file not found!"
              exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.msi

  # ================= macOS 构建 =================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Briefcase
        run: pip install briefcase
      - name: Build macOS DMG
        run: briefcase create --no-input && briefcase build --no-input && briefcase package --no-input --adhoc-sign
      - name: Rename & Upload Artifact
        run: |
              VER=${GITHUB_REF_NAME#v}
              mv dist/*.dmg "Nexus-Chat-MacOS-v${VER}.dmg"
            
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Nexus-Chat-MacOS-*.dmg

  # ================= Android 构建 =================
  #build-android:
  #  runs-on: ubuntu-latest
  #  steps:
  #    - uses: actions/checkout@v4
  #    - name: Set up Python
  #      uses: actions/setup-python@v5
  #      with:
  #        python-version: '3.13'
  #    - name: Install Briefcase
  #      run: pip install briefcase
  #    - name: Build Android APK
  #      run: briefcase create && briefcase build && briefcase package
  #    - name: Rename & Upload Artifact
  #      run: |
  #        VER=${GITHUB_REF_NAME#v}
  #        NEW_NAME="Nexus-Chat-Android-v${VER}.apk"
  #        
  #        # 查找生成的 apk 文件并重命名
  #        FILE=$(find build -name "*.apk" | head -n 1)
  #        if [ -f "$FILE" ]; then
  #            cp "$FILE" "$NEW_NAME"
  #            echo "Renamed to: $NEW_NAME"
  #        else
  #            echo "APK file not found!"
  #            exit 1
  #        fi
  #    - uses: actions/upload-artifact@v4
  #      with:
  #        name: android-apk
  #        path: Nexus-Chat-Android-v*.apk

      # ================= Android 构建 =================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Dependencies
        run: |
          pip install briefcase
          sudo apt-get update
          sudo apt-get install -y libc6-dev libffi-dev libssl-dev zlib1g-dev
      - name: Build Android APK
        run: |
          # 使用 --no-input 避免交互，--update 确保资源同步
          briefcase create android --no-input
          briefcase build android --no-input
          briefcase package android --no-input
          
          # --- 关键修复：增加文件查找和调试步骤 ---
          echo "🔍 正在查找生成的 APK 文件..."
          # 1. 列出 build 目录下所有 .apk 文件，方便我们确认路径
          find build -name "*.apk" -ls
          
          # 2. 尝试找到 release 版本的 APK (排除 unsigned 的)
          APK_PATH=$(find build -path "*/release/*.apk" -not -name "*unsigned*" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ 错误：未找到 Release 版本的 APK 文件！"
            exit 1
          fi
          
          echo "✅ 找到 APK: $APK_PATH"
          
          # 3. 获取版本号
          VER=${GITHUB_REF_NAME#v}
          NEW_NAME="Nexus-Chat-Android-v${VER}.apk"
          
          # 4. 复制到项目根目录并重命名
          cp "$APK_PATH" "./$NEW_NAME"
          echo "📦 已复制并重命名为: $NEW_NAME"
          
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Nexus-Chat-Android-*.apk
  # ================= 创建 Release =================
  create-release:
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      # 1. 下载所有构建产物
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 2. 计算哈希值
      - name: Generate Checksums
        id: checksum
        run: |
          cd dist
          sha256sum *.msi *.dmg *.apk > checksums.txt
          cat checksums.txt
          
          # 将内容存入环境变量供后续使用
          HASH_BODY=$(cat checksums.txt)
          echo "hash_body<<EOF" >> $GITHUB_OUTPUT
          echo "$HASH_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 3. 创建 Release (修复了 tag -> tag_name)
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}  # <--- 关键修复：这里必须是 tag_name
          name: Nexus-Chat ${{ github.ref_name }}
          body: |
            🚀 自动发布 ${{ github.ref_name }}
            
            ### 文件校验值 (SHA256):
            ```text
             $ {{ steps.checksum.outputs.hash_body }}

            ```
          files: |
            dist/*.msi
            dist/*.dmg
            dist/*.apk
            dist/checksums.txt
          draft: false
          prerelease: true

      
    # ================= 生成版本文件并推送到 NC-Updater =================
  generate-version-files:
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 获取基础信息
      - name: Get version info
        id: get_info
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # 2. 下载刚刚生成的 checksums.txt 以获取 Hash 值
      - name: Download Checksums
        run: |
          # 从 Release 页面下载最新的 checksums.txt
          curl -L -o checksums.txt \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.get_info.outputs.tag }}/checksums.txt"
          
          # 解析 Hash 值到环境变量 (适配 Nexus-Chat-Platform-Version.ext 格式)
          WIN_HASH=$(grep 'Windows' checksums.txt | awk '{print $1}')
          MAC_HASH=$(grep 'MacOS' checksums.txt | awk '{print $1}')
          AND_HASH=$(grep 'Android' checksums.txt | awk '{print $1}')

          echo "windows_hash=$WIN_HASH" >> $GITHUB_ENV
          echo "macos_hash=$MAC_HASH" >> $GITHUB_ENV
          echo "android_hash=$AND_HASH" >> $GITHUB_ENV
          
          echo "✅ Hashes loaded:"
          echo "Win: $WIN_HASH"
          echo "Mac: $MAC_HASH"
          echo "And: $AND_HASH"

      # 3. 生成 version.json (当前最新版本)
      - name: Generate version.json
        run: |
          VERSION="${{ steps.get_info.outputs.version }}"
          TAG="${{ steps.get_info.outputs.tag }}"
          REPO="${{ github.repository }}"
          NOW=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S CST')

          cat > version.json << EOF
          {
            "latest_version": "$VERSION",
            "release_date": "$NOW",
            "release_notes": "Release $VERSION",
            "downloads": {
              "windows": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-Windows-$VERSION.msi",
              "macos": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-MacOS-$VERSION.dmg",
              "android": "https://github.com/$REPO/releases/download/$TAG/Nexus-Chat-Android-$VERSION.apk"
            },
            "checksums": {
              "windows": "$windows_hash",
              "macos": "$macos_hash",
              "android": "$android_hash"
            }
          }
          EOF

      # 4. 拉取旧的历史版本文件
      - name: Fetch existing version_history.json
        run: |
          curl -sf "https://lalala0237.github.io/NC-Updater/version_history.json" \
            -o old_history.json 2>/dev/null || echo "" > old_history.json

      # 5. 生成带注释的 version_history.json (重构拼接逻辑)
              # 5. 生成带注释的 version_history.json (使用 jq 重构)
      - name: Generate version_history.json
        run: |
          # --- 安装 jq 工具 ---
          sudo apt-get update && sudo apt-get install -y jq
          
          VERSION="${{ steps.get_info.outputs.version }}"
          TAG="${{ steps.get_info.outputs.tag }}"
          REPO="${{ github.repository }}"
          NOW=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S CST')
          
          # --- 判断是否为预发布 ---
          IS_PRE="false"
          VER_TYPE="正式版本 (Stable)"
          VER_WARN="// ✅ 此版本为正式发布版本，推荐所有用户更新"
          if [[ "$VERSION" == *"rc"* ]]; then
            IS_PRE="true"
            VER_TYPE="预发布版本 (Prerelease)"
            VER_WARN="// ⚠️ 注意：此版本为预发布版本，可能包含未修复的 Bug，仅供测试使用"
          fi
          
          # --- A. 创建新版本的 JSON 对象 ---
          # 使用 jq 来构建一个完美的 JSON 对象，不用担心引号和格式问题
          NEW_VERSION_JSON=$(jq -n \
            --arg ver "$VERSION" \
            --arg date "$NOW" \
            --argjson is_pre "$IS_PRE" \
            --arg tag "$TAG" \
            --arg repo "$REPO" \
            --arg win_hash "$windows_hash" \
            --arg mac_hash "$macos_hash" \
            --arg and_hash "$android_hash" \
            '{
              version: $ver,
              release_date: $date,
              is_prerelease: $is_pre,
              tag_name: $tag,
              release_page: "https://github.com/\($repo)/releases/tag/\($tag)",
              downloads: {
                windows: "https://github.com/\($repo)/releases/download/\($tag)/Nexus-Chat-Windows-\($ver).msi",
                macos: "https://github.com/\($repo)/releases/download/\($tag)/Nexus-Chat-MacOS-\($ver).dmg",
                android: "https://github.com/\($repo)/releases/download/\($tag)/Nexus-Chat-Android-\($ver).apk"
              },
              checksums: {
                windows: $win_hash,
                macos: $mac_hash,
                android: $and_hash
              }
            }')
          
          # --- B. 生成最终文件 ---
          {
            # 1. 写入文件头注释
            cat << 'HEADER'
          // ====================================================================
          //  Nexus Chat - 版本发布历史记录文件 (Version Release History)
          // ====================================================================
          //
          //  【文件用途】
          //    本文件完整记录了 Nexus Chat 项目自首次发布以来的所有版本发布信息。
          //    供客户端「历史版本」页面展示，以及版本回溯、问题排查使用。
          //
          //  【文件维护方式】
          //    本文件由 GitHub Actions 自动化工作流 (release.yml) 在每次成功构建
          //    并创建 Release 后自动更新。请勿手动编辑本文件，手动修改将在下次
          //    自动发布时被覆盖。
          //
          //  【文件格式说明】
          //    - 文件顶部的 "//" 开头行为注释，不会被 JSON 解析器读取
          //    - JSON 数据部分（"history" 数组）为纯 JSON，可被标准解析器正常读取
          //    - 客户端 updater.py 使用正则去除 "//" 注释行后再进行 JSON 解析
          //
          // ====================================================================
          HEADER

            # 2. 写入当前版本的注释块
            cat << EOF
          // --------------------------------------------------------------------
          //  版本: $TAG ($VER_TYPE)
          //  发布时间: $NOW
          //  Git Tag: $TAG
          //  构建仓库: $REPO
          $VER_WARN
          // --------------------------------------------------------------------
          EOF

            # 3. 开始写入 JSON 结构
            echo "{"
            echo '  "history": ['
            
            # 4. 写入新版本数据 (jq 生成的已经是格式化好的 JSON)
            echo "    $NEW_VERSION_JSON,"
            
            # 5. 合并旧数据
            if [ -s old_history.json ]; then
              # 提取旧文件中的 history 数组内容，并去掉首尾的 []
              # 然后用 sed 给每一行前面加 4 个空格来保持缩进
              grep -v '^\s*//' old_history.json | jq '.history' | sed '1d;$d' | sed 's/^/    /'
            fi
            
            # 6. 闭合 JSON 结构
            echo "  ]"
            echo "}"
            
          } > version_history.json
          
          echo "✅ version_history.json generated successfully."
      # 6. 推送到 NC-Updater 仓库
      - name: Push to NC-Updater
        env:
          MY_TOKEN: ${{ secrets.UPDATER_REPO_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${MY_TOKEN}@github.com/lalala0237/NC-Updater.git target_repo

          cp "$GITHUB_WORKSPACE/version.json" target_repo/
          cp "$GITHUB_WORKSPACE/version_history.json" target_repo/

          cd target_repo
          if [ -z "$(git status --porcelain)" ]; then
            echo "✅ No changes detected, skipping push."
            exit 0
          fi

          git add .
          git commit -m "chore: auto update version files from Nexus-Chat"
          git push origin main
          echo "✅ Successfully pushed to lalala0237/NC-Updater"
